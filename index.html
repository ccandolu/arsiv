/* Refined dark interface */
:root{--bg:#101114;--surface:#191b20;--ink:#f5f6f8;--muted:#9297a2;--line:#2a2d34;--blue:#3985f7;--hover:#242832}
body{background:radial-gradient(ellipse at 50% -18%,#1b2432 0,transparent 42%),var(--bg)}
.shell{max-width:1320px;padding-top:25px}
.toolbar{margin-bottom:28px}
.brand-icon{border-radius:11px;box-shadow:0 5px 18px #3985f733}
.brand b{font-size:18px;letter-spacing:-.5px}
.btn{background:#22252c;border:1px solid #343943;border-radius:11px;padding:9px 13px;transition:background .18s,border-color .18s}
.btn:hover{background:#2b3039;border-color:#48515f}
.btn.blue{background:var(--blue);border-color:var(--blue);box-shadow:0 5px 18px #3985f72b}
.layout{grid-template-columns:218px minmax(0,1fr);gap:27px}
.sidebar{background:#17191e;border-color:#292d35;border-radius:16px;padding:13px;box-shadow:0 10px 35px #00000018}
.side-title{letter-spacing:.8px;text-transform:uppercase;font-size:9px}
.nav{padding:10px;border-radius:10px;font-size:12px;color:#c5c9d1}
.nav.active{background:#1c3554;color:#9bc6ff}
.nav .ico{font-size:16px}
.head{margin:3px 0 23px;align-items:center}
.head h1{font-size:30px;letter-spacing:-1.1px}
.head p{font-size:12px;color:#8e94a0}
.search input{background:#1a1d23;color:var(--ink);border:1px solid #30343d;border-radius:12px;padding:11px 12px 11px 35px;font-size:12px}
.search input::placeholder{color:#777e8a}
.search:before{left:12px;top:5px}
.section{margin:23px 0 11px}
.section h2{font-size:13px;letter-spacing:-.15px}
.location{position:relative;min-width:0;min-height:76px;flex:1 1 175px;padding:11px 38px 11px 12px;border-radius:13px;background:linear-gradient(145deg,#20242b,#191c22);border-color:#2b3039;overflow:hidden;transition:transform .18s,border-color .18s,background .18s}
.location:hover{transform:translateY(-2px);background:#242a34;border-color:#46566b}
.location .folder-icon{font-size:27px;filter:drop-shadow(0 3px 7px #3985f72a)}
.folder-copy{position:relative;z-index:1;min-width:0}
.location b{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.location small{font-size:10px;color:#9299a5}
.folder-cover{width:52px;height:52px;object-fit:cover;border-radius:9px;flex:none;box-shadow:0 2px 10px #0005}
.location.has-cover{background:#1a1d23}
.folder-more{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:#ffffff0a;color:#aab1bd;border-radius:8px;font-size:18px;padding:2px 7px}
.filegrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.file{border:1px solid #262a32;border-radius:13px;padding:11px 9px 10px;background:#17191e;transition:background .18s,border-color .18s,transform .18s}
.file:hover{background:#20242c;border-color:#394251;transform:translateY(-1px)}
.file.selected{background:#1b3552;border-color:#3d78bb}
.preview{height:104px;border-radius:9px;background:#20232a}
.preview img,.preview video{border-radius:8px}
.doc-icon{font-size:45px}
.file-name{font-size:11px;font-weight:550;color:#e7e9ed}
.file-meta{font-size:9px;color:#858d9a;line-height:1.4}
.filelist .file{background:transparent;border:0;border-bottom:1px solid #292d35;border-radius:0;transform:none;padding:10px}
.filelist .file:hover{background:#1b1f26}
.filelist .preview{background:#20232a;border-radius:8px}
.filelist .file-meta{display:block;width:220px}
.empty{border-color:#343943;border-radius:14px;background:#17191e;padding:48px 15px}
.drop-hint{border-color:#343943;border-radius:13px;background:#15171c;padding:14px 16px}
.drop-hint.over{background:#192b42}
.modal,.preview-modal{background:#1b1e24;border-color:#343943;border-radius:17px}
.modal input{background:#111318;border-color:#363b45;color:var(--ink);border-radius:10px}
.context{background:#20232a;border-color:#3a404b;border-radius:12px;box-shadow:0 12px 35px #0008}
.context button{padding:10px;border-radius:8px}
.context button:hover{background:#303641}
.toast{background:#e8edf5;color:#17191e;font-weight:600;bottom:28px}
.preview-stage{background:#090a0d}
.mobile-tabs{display:none}

}

/* Upload progress + touch interactions */
.upload-progress{height:3px;background:#292d35;border-radius:9px;overflow:hidden;margin:-15px 0 18px;display:none}
.upload-progress.show{display:block}
.upload-progress>i{display:block;height:100%;width:0;background:var(--blue);transition:width .12s}
.file{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.file.touch-dragging{opacity:.35}
.location.touch-target{border-color:var(--blue)!important;background:#1b3552!important;box-shadow:0 0 0 2px #3985f744}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;padding:10px 14px;border:1px solid #568ed5;border-radius:12px;background:#202a38;color:#fff;box-shadow:0 12px 35px #0008;font-size:12px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.danger{background:#3a2024;border-color:#63333b;color:#ff929b}
.btn.danger:hover{background:#51272e}
.preview-foot{align-items:center}
@media(max-width:620px){.upload-progress{margin:-8px 0 16px}.preview-foot .btn{min-height:38px}}

<input type="file" id="picker" multiple hidden>
<div class="overlay" id="nameOverlay"><div class="modal"><h3 id="modalTitle">Yeni klasör</h3><p id="modalDesc">Klasör için bir ad gir.</p><input id="nameInput" placeholder="Klasör adı" maxlength="90"><div class="modal-actions"><button class="btn" id="cancel">Vazgeç</button><button class="btn blue" id="save">Oluştur</button></div></div></div>
<div class="overlay" id="previewOverlay"><div class="preview-modal"><div class="preview-top"><b id="previewName"></b><button class="btn" id="closePreview">Kapat</button></div><div class="preview-stage" id="stage"></div><div class="preview-foot"><span id="previewMeta"></span><div style="display:flex;gap:7px"><button class="btn danger" id="deleteFile">Sil</button><button class="btn" id="renameFile">Yeniden adlandır</button></div></div></div></div>
<div class="context" id="menu"></div><div class="toast" id="toast"></div>
<script>
const DB='apple-files-archive',STORE='files';let db,folders=[],files=[],locationId=null,filter='all',list=false,menuId=null,modalCB=null,previewFile=null;
const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID(),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
function allFiles(){return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
function saveFile(f){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(f);t.oncomplete=ok;t.onerror=()=>no(t.error);});}
function persistFolders(){localStorage.setItem('apple-files-folders',JSON.stringify(folders));}
function folderName(id){return folders.find(f=>f.id===id)?.name||'Dosyalarım';}
function childFolders(id){return folders.filter(f=>(f.parent||null)===(id||null));}
function bytes(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';}
function createdLabel(ts){return new Date(ts).toLocaleString('tr-TR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900);}
function folderIcon(){return '<svg class="folder-art" viewBox="0 0 160 130" aria-hidden="true"><defs><linearGradient id="folderBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79d2f5"/><stop offset="1" stop-color="#249bd8"/></linearGradient></defs><path d="M8 25Q8 8 25 8h37q8 0 14 7l9 9h50q17 0 17 17v70q0 15-16 15H24Q8 126 8 110Z" fill="url(#folderBlue)" stroke="#58bce9" stroke-width="2"/><path d="M8 39q0-15 17-15h112q15 0 15 15v5H8Z" fill="#b9edff" opacity=".8"/><path d="M8 44q0-13 16-13h112q16 0 16 14v65q0 16-16 16H24Q8 126 8 110Z" fill="url(#folderBlue)" stroke="#4cb8e9" stroke-width="1.5"/></svg>'; }
function promptName(title,desc,button,cb,value=''){ $('modalTitle').textContent=title;$('modalDesc').textContent=desc;$('save').textContent=button;$('nameInput').value=value;modalCB=cb;$('nameOverlay').classList.add('show');setTimeout(()=>$('nameInput').focus(),60);}
function closePrompt(){$('nameOverlay').classList.remove('show');modalCB=null;}
function createFolder(parent=locationId){promptName('Yeni klasör','Bu konumda yeni bir klasör oluştur.','Oluştur',name=>{folders.push({id:uid(),name,parent:parent||null,created:Date.now()});persistFolders();render();toast('Klasör oluşturuldu');});}
function renameFolder(id){let f=folders.find(x=>x.id===id);if(f)promptName('Adını değiştir','Yeni klasör adını gir.','Kaydet',n=>{f.name=n;persistFolders();render();toast('Ad güncellendi');},f.name);}
function deleteFolder(id){let f=folders.find(x=>x.id===id);if(!f||!confirm('“'+f.name+'” klasörü silinsin mi? İçindeki dosyalar Dosyalarım konumuna taşınır.'))return;let ids=[id];for(let i=0;i<ids.length;i++)folders.filter(x=>x.parent===ids[i]).forEach(x=>ids.push(x.id));files.forEach(x=>{if(ids.includes(x.folder))x.folder=null;});Promise.all(files.map(saveFile)).then(()=>{folders=folders.filter(x=>!ids.includes(x.id));persistFolders();locationId=null;render();});}
async function uploadThese(list,target=locationId){
 const arr=[...list];if(!arr.length)return;
 const bar=$('uploadProgress'),fill=$('uploadProgressBar');bar.classList.add('show');fill.style.width='0%';
 try{
  const records=arr.map(f=>({id:uid(),name:f.name,type:f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':'other',mime:f.type,size:f.size,created:Date.now(),folder:target||null,blob:f}));
  // Küçük gruplar halinde tek transaction: tek tek dosya kaydetmekten çok daha az IndexedDB işlemi.
  const batchSize=12;
  for(let i=0;i<records.length;i+=batchSize){
   const batch=records.slice(i,i+batchSize);
   await new Promise((ok,no)=>{const tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE);batch.forEach(record=>store.put(record));tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error||new Error('Yükleme iptal edildi'));});
   fill.style.width=Math.round(Math.min(i+batch.length,records.length)/records.length*100)+'%';
  }
  files=await allFiles();render();toast(arr.length+' dosya yüklendi');
 }catch(err){console.error(err);toast('Yükleme sırasında hata oluştu');files=await allFiles();render();}
 finally{setTimeout(()=>{bar.classList.remove('show');fill.style.width='0%';},650);}
}
function render(){let q=$('search').value.trim().toLocaleLowerCase('tr');let child=childFolders(locationId);$('title').textContent=locationId?folderName(locationId):({all:'Son Kullanılanlar',image:'Fotoğraflar',video:'Videolar',recent:'Son Eklenenler'}[filter]);$('subtitle').textContent=locationId?'Bu klasördeki öğeler.':'Dosyalarına ve klasörlerine göz at.';$('folderHeading').textContent=locationId?'Alt Klasörler':'Klasörler';$('folderCount').textContent=child.length+' klasör';$('fileHeading').textContent='Dosyalar';
let chain=[],f=folders.find(x=>x.id===locationId);while(f){chain.unshift(f);f=folders.find(x=>x.id===f.parent);}
$('crumbs').innerHTML='<button data-root>Dosyalarım</button>'+chain.map(x=>' <span>›</span> <button data-crumb="'+x.id+'">'+esc(x.name)+'</button>').join('');
$('folders').innerHTML=child.length?child.map(x=>{let cover=files.find(z=>z.id===x.cover&&z.type==='image');let coverURL=cover?URL.createObjectURL(cover.blob):'';let itemCount=files.filter(z=>z.folder===x.id).length+childFolders(x.id).length;return `<div class="location ${cover?'has-cover':''}" data-folder="${x.id}" data-drop="${x.id}" draggable="false"><button data-more="${x.id}" aria-label="Klasör seçenekleri" class="folder-more">···</button><div class="folder-visual">${cover?`<img class="folder-cover" src="${coverURL}" alt="">`:folderIcon()}</div><span class="folder-copy"><b>${esc(x.name)}</b><small>${itemCount} öğe</small></span></div>`}).join(''):'<div style="font-size:11px;color:var(--muted)">Bu konumda klasör yok. <button id="inlineFolder" style="color:var(--blue);background:none">Yeni klasör oluştur</button></div>';
let arr=[...files];if(locationId)arr=arr.filter(x=>x.folder===locationId);else if(filter==='image')arr=arr.filter(x=>x.type==='image');else if(filter==='video')arr=arr.filter(x=>x.type==='video');else if(filter==='recent')arr.sort((a,b)=>b.created-a.created);if(q)arr=arr.filter(x=>x.name.toLocaleLowerCase('tr').includes(q)||folderName(x.folder).toLocaleLowerCase('tr').includes(q));$('count').textContent=arr.length+' öğe';
let host=$('files');host.className=list?'filelist':'filegrid';if(!arr.length){host.innerHTML='<div class="empty"><b>Bu klasör boş</b>Dosya eklemek için Yükle düğmesini kullan veya dosyaları buraya sürükle.</div>';return;}
host.innerHTML=arr.sort((a,b)=>b.created-a.created).map(x=>{let thumb=x.type==='image'?`<img src="${URL.createObjectURL(x.blob)}">`:x.type==='video'?`<video src="${URL.createObjectURL(x.blob)}" muted></video>`:`<span class="doc-icon ${x.mime==='application/pdf'?'pdf-icon':''}">${x.mime==='application/pdf'?'PDF':x.mime.includes('word')?'W':x.mime.includes('sheet')?'X':x.mime.includes('presentation')?'P':'▤'}</span>`;return `<div class="file" draggable="true" data-file="${x.id}"><div class="preview">${thumb}</div><div class="file-name">${esc(x.name)}</div><div class="file-meta">${createdLabel(x.created)} · ${bytes(x.size)}</div></div>`}).join('');
$('sideFolders').innerHTML=folders.filter(x=>!x.parent).map(x=>`<div class="side-folder ${locationId===x.id?'active':''}" data-side="${x.id}"><span class="symbol">📁</span><span class="name">${esc(x.name)}</span><span class="num">${files.filter(z=>z.folder===x.id).length}</span></div>`).join('');
}
function showMenu(id,x,y){menuId=id;$('menu').innerHTML='<button data-act="open">Klasörü aç</button><button data-act="cover">Kapak fotoğrafı seç</button><button data-act="rename">Yeniden adlandır</button><button data-act="sub">Yeni alt klasör</button><button data-act="delete" class="danger">Sil</button>';$('menu').style.left=Math.min(x,innerWidth-180)+'px';$('menu').style.top=Math.min(y,innerHeight-150)+'px';$('menu').classList.add('show');}
function closeMenu(){$('menu').classList.remove('show');}
function chooseFolderCover(id){let f=folders.find(x=>x.id===id);if(!f)return;let imgs=files.filter(x=>x.type==='image'&&(x.folder===id));if(!imgs.length){toast('Önce bu klasöre bir fotoğraf ekle');return;}let options=imgs.map((x,i)=>(i+1)+'. '+x.name).join('\\n');let answer=prompt('Kapak olarak kullanılacak fotoğrafın numarasını yaz:\\n\\n'+options);if(answer===null)return;let index=Number(answer)-1;if(!Number.isInteger(index)||index<0||index>=imgs.length){toast('Geçerli bir numara gir');return;}f.cover=imgs[index].id;persistFolders();render();toast('Klasör kapağı güncellendi');}
function preview(id){let f=files.find(x=>x.id===id);if(!f)return;previewFile=f;$('previewName').textContent=f.name;$('previewMeta').textContent=bytes(f.size)+' · '+folderName(f.folder);let s=$('stage');s.innerHTML='';if(f.type==='image'){let i=document.createElement('img');i.src=URL.createObjectURL(f.blob);s.append(i);}else if(f.type==='video'){let v=document.createElement('video');v.src=URL.createObjectURL(f.blob);v.controls=true;s.append(v);}else s.textContent='Bu dosya türü önizlenemiyor.';$('previewOverlay').classList.add('show');}
function closePreview(){$('previewOverlay').classList.remove('show');$('stage').innerHTML='';previewFile=null;}
async function deleteFile(id){
 const f=files.find(x=>x.id===id);if(!f)return;
 if(!confirm('“'+f.name+'” dosyası kalıcı olarak silinsin mi?'))return;
 await new Promise((ok,no)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=ok;tx.onerror=()=>no(tx.error);});
 folders.forEach(folder=>{if(folder.cover===id)delete folder.cover;});persistFolders();
 files=await allFiles();closePreview();render();toast('Dosya silindi');
}
$('newFolder').onclick=$('sideAdd').onclick=()=>createFolder();$('upload').onclick=()=>$('picker').click();$('picker').onchange=e=>{if(e.target.files.length)uploadThese(e.target.files);e.target.value='';};
$('save').onclick=()=>{let n=$('nameInput').value.trim();if(!n)return;modalCB?.(n);closePrompt();};$('cancel').onclick=closePrompt;$('nameInput').onkeydown=e=>{if(e.key==='Enter')$('save').click();if(e.key==='Escape')closePrompt();};
$('view').onclick=()=>{list=!list;$('view').textContent=list?'▦':'☷';render();};$('search').oninput=render;
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{filter=n.dataset.filter;locationId=null;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===n));render();});
document.querySelectorAll('[data-mobile-filter]').forEach(n=>n.onclick=()=>{filter=n.dataset.mobileFilter;locationId=null;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));document.querySelectorAll('[data-mobile-filter]').forEach(x=>x.classList.toggle('active',x===n));render();});
$('mobileSearch').onclick=()=>{document.querySelectorAll('[data-mobile-filter]').forEach(x=>x.classList.remove('active'));$('mobileSearch').classList.add('active');locationId=null;$('search').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>$('search').focus(),250);};
$('folders').onclick=e=>{let more=e.target.closest('[data-more]');if(more){e.stopPropagation();showMenu(more.dataset.more,e.clientX,e.clientY);return;}let x=e.target.closest('[data-folder]');if(x){locationId=x.dataset.folder;filter='all';render();}};
$('sideFolders').onclick=e=>{let x=e.target.closest('[data-side]');if(x){locationId=x.dataset.side;filter='all';render();}};
$('crumbs').onclick=e=>{if(e.target.closest('[data-root]')){locationId=null;filter='all';render();}let x=e.target.closest('[data-crumb]');if(x){locationId=x.dataset.crumb;render();}};
$('folders').addEventListener('click',e=>{if(e.target.id==='inlineFolder')createFolder();});
$('menu').onclick=e=>{let a=e.target.dataset.act;if(!a)return;let id=menuId;closeMenu();if(a==='open'){locationId=id;render();}if(a==='cover')chooseFolderCover(id);if(a==='rename')renameFolder(id);if(a==='sub')createFolder(id);if(a==='delete')deleteFolder(id);};
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('[data-more]'))closeMenu();});
$('files').onclick=e=>{let x=e.target.closest('[data-file]');if(x&&!suppressFileClick)preview(x.dataset.file);};
$('deleteFile').onclick=()=>{if(previewFile)deleteFile(previewFile.id);};
$('renameFile').onclick=()=>{if(!previewFile)return;let f=previewFile;promptName('Yeniden adlandır','Dosya için yeni bir ad gir.','Kaydet',async n=>{f.name=n;await saveFile(f);files=await allFiles();closePreview();render();},f.name);};
$('closePreview').onclick=closePreview;$('previewOverlay').onclick=e=>{if(e.target===$('previewOverlay'))closePreview();};
$('files').addEventListener('dragstart',e=>{let x=e.target.closest('[data-file]');if(x){e.dataTransfer.setData('text/plain',x.dataset.file);e.dataTransfer.effectAllowed='move';}});
$('folders').addEventListener('dragover',e=>{if(e.target.closest('[data-drop]'))e.preventDefault();});
$('folders').addEventListener('drop',async e=>{let x=e.target.closest('[data-drop]');if(!x)return;e.preventDefault();let id=e.dataTransfer.getData('text/plain'),f=files.find(z=>z.id===id);if(f){f.folder=x.dataset.drop;await saveFile(f);files=await allFiles();render();toast('Dosya taşındı');}else if(e.dataTransfer.files.length)uploadThese(e.dataTransfer.files,x.dataset.drop);});
// iPhone/iPad: dosyaya basılı tutup klasörün üzerine bırakarak taşı.
let touchDrag=null,touchTimer=null,touchGhost=null,suppressFileClick=false;
$('files').addEventListener('pointerdown',e=>{
 if(e.pointerType!=='touch')return;
 const tile=e.target.closest('[data-file]');if(!tile)return;
 clearTimeout(touchTimer);
 touchDrag={id:tile.dataset.file,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,active:false,tile};
 touchTimer=setTimeout(()=>{
  if(!touchDrag)return;
  touchDrag.active=true;suppressFileClick=true;tile.classList.add('touch-dragging');
  touchGhost=document.createElement('div');touchGhost.className='drag-ghost';touchGhost.textContent='📄 '+(files.find(f=>f.id===touchDrag.id)?.name||'Dosya');document.body.append(touchGhost);
  moveTouchGhost(touchDrag.x,touchDrag.y);if(navigator.vibrate)navigator.vibrate(25);
 },430);
},{passive:true});
function moveTouchGhost(x,y){
 if(touchGhost){touchGhost.style.left=Math.min(x+12,innerWidth-205)+'px';touchGhost.style.top=Math.min(y+12,innerHeight-55)+'px';}
 document.querySelectorAll('.location.touch-target').forEach(el=>el.classList.remove('touch-target'));
 if(touchDrag?.active){const el=document.elementFromPoint(x,y)?.closest('[data-folder]');if(el)el.classList.add('touch-target');}
}
document.addEventListener('pointermove',e=>{
 if(!touchDrag||e.pointerType!=='touch')return;
 touchDrag.x=e.clientX;touchDrag.y=e.clientY;
 if(!touchDrag.active&&Math.hypot(e.clientX-touchDrag.startX,e.clientY-touchDrag.startY)>12){clearTimeout(touchTimer);touchTimer=null;return;}
 if(touchDrag.active){e.preventDefault();moveTouchGhost(e.clientX,e.clientY);}
},{passive:false});
async function finishTouchDrag(e){
 if(!touchDrag||e.pointerType!=='touch')return;
 clearTimeout(touchTimer);const state=touchDrag;touchDrag=null;
 document.querySelectorAll('.touch-target').forEach(el=>el.classList.remove('touch-target'));
 if(touchGhost){touchGhost.remove();touchGhost=null;}
 state.tile.classList.remove('touch-dragging');
 if(state.active){
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-folder]');
  if(target){const f=files.find(x=>x.id===state.id);if(f){f.folder=target.dataset.folder;await saveFile(f);files=await allFiles();render();toast('Dosya klasöre taşındı');}}
  setTimeout(()=>{suppressFileClick=false;},350);
 }else{setTimeout(()=>{suppressFileClick=false;},80);}
}
document.addEventListener('pointerup',finishTouchDrag);
document.addEventListener('pointercancel',finishTouchDrag);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePrompt();closePreview();closeMenu();}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='u'){e.preventDefault();$('picker').click();}});
(async()=>{try{db=await openDB();folders=JSON.parse(localStorage.getItem('apple-files-folders')||'[]');files=await allFiles();render();}catch(e){toast('Tarayıcı depolaması açılamadı.');}})();
</script></body></html>
